name: Deploy to GitHub Pages

# ทุกครั้งที่มีการ push โค้ดใหม่ จะ mirror ไปที่ branch gh-pages
# ซึ่ง GitHub Pages ใช้เผยแพร่เว็บโดยอัตโนมัติ
on:
  push:
    branches: [claude/quotation-invoice-webapp-paga9a]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
